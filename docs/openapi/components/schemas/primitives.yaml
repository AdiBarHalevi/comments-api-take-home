Uuid:
  type: string
  format: uuid

NullableUuid:
  type: [string, 'null']
  format: uuid

CommentId:
  allOf:
    - $ref: 'primitives.yaml#/Uuid'
  description: Stable internal id — use for reply URLs and polling

Cursor:
  type: string
  description: Opaque pagination cursor from a previous response's `pagination.nextCursor`

NullableCursor:
  type: [string, 'null']
  description: Pass as `cursor` on the next request; omitted or `null` when no next page

Limit:
  type: integer
  minimum: 1
  maximum: 100
  default: 50
  description: Page size

CommentText:
  type: string
  minLength: 1
  description: Comment or reply body text

NullableString:
  type: [string, 'null']
