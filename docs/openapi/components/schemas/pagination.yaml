Pagination:
  type: object
  properties:
    nextCursor:
      $ref: 'primitives.yaml#/NullableCursor'

PaginatedQuery:
  type: object
  description: Shared query parameters for paginated comment endpoints
  properties:
    cursor:
      $ref: 'primitives.yaml#/Cursor'
    limit:
      $ref: 'primitives.yaml#/Limit'

PaginatedCommentsResponse:
  type: object
  required: [data, pagination]
  properties:
    data:
      type: array
      items:
        $ref: 'comment.yaml#/Comment'
    pagination:
      $ref: '#/Pagination'
