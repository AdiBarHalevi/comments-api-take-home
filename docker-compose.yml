services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: comments
      POSTGRES_PASSWORD: comments
      POSTGRES_DB: comments
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U comments -d comments']
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: comments
      POSTGRES_PASSWORD: comments
      POSTGRES_DB: comments_test
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U comments -d comments_test']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  mock-instagram:
    image: mockoon/cli:9
    ports:
      - '3001:3001'
    volumes:
      - ./mocks/mockoon/instagram.json:/data/instagram.json:ro
    command: ['--data', '/data/instagram.json', '--port', '3001']

  mock-x:
    image: mockoon/cli:9
    ports:
      - '3002:3002'
    volumes:
      - ./mocks/mockoon/x.json:/data/x.json:ro
    command: ['--data', '/data/x.json', '--port', '3002']

volumes:
  postgres-data:
  postgres-test-data:
  redis-data:
