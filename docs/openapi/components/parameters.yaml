postId:
  name: postId
  in: path
  required: true
  description: Local post id (UUID)
  schema:
    $ref: './schemas/primitives.yaml#/Uuid'

commentId:
  name: commentId
  in: path
  required: true
  description: Local comment id (UUID)
  schema:
    $ref: './schemas/primitives.yaml#/Uuid'

cursor:
  name: cursor
  in: query
  required: false
  description: Opaque pagination cursor from a previous response's `pagination.nextCursor`
  schema:
    $ref: './schemas/primitives.yaml#/Cursor'

limit:
  name: limit
  in: query
  required: false
  description: Page size (1–100)
  schema:
    $ref: './schemas/primitives.yaml#/Limit'
